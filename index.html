<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TeamHub — Application équipes</title>
  <link rel="stylesheet" href="styles.css?v=5">
<style>
.auth-gate{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:var(--cream)}
.auth-gate[hidden]{display:none}
.auth-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.12);color:var(--green)}
.auth-brand{padding:0 0 24px}.auth-card h2{margin:0 0 6px;font-size:24px}.auth-card form{display:grid;gap:13px;margin-top:20px}.auth-card label{display:grid;gap:6px;font-size:12px;font-weight:650;color:#53645c}.auth-card input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff;color:var(--green);font:inherit}.auth-switch,.auth-logout{border:0;background:transparent;color:var(--green);cursor:pointer;font-size:12px;margin-top:14px;text-decoration:underline}.auth-logout{display:block;margin-left:auto;margin-right:auto}body.dark .auth-gate{background:#171b19}body.dark .auth-card{background:#202622;border-color:#303733;color:#e8eee9}body.dark .auth-card label{color:#b8c5bf}body.dark .auth-card input{background:#181d1a;border-color:#3a433e;color:#e8eee9}
</style>\n</head>
<body>
  <div id="authGate" class="auth-gate" hidden><div class="auth-card"><div class="brand auth-brand"><span class="brand-mark">T</span><div><strong>TeamHub</strong><small>Gestion des équipes</small></div></div><h2 id="authTitle">Connexion</h2><p id="authMessage" class="muted">Connectez-vous pour accéder à votre équipe.</p><form id="authForm"><label>Email<input id="authEmail" type="email" required autocomplete="email" placeholder="vous@exemple.fr"></label><label>Mot de passe<input id="authPassword" type="password" required autocomplete="current-password" placeholder="••••••••"></label><label id="authNameWrap" hidden>Nom complet<input id="authName" type="text" autocomplete="name" placeholder="Aloïs Monier"></label><button class="btn" id="authSubmit">Se connecter</button></form><button class="auth-switch" id="authSwitch" type="button">Créer mon compte</button><button class="auth-logout" id="authLogout" type="button" hidden>Se déconnecter</button></div></div>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">T</span><div><strong>TeamHub</strong><small>Gestion des équipes</small></div></div>
      <nav>
<button class="nav-item active" data-view="dashboard"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10.5V19h11v-8.5"/><path d="M10 19v-5h4v5"/></svg></span><span>Tableau de bord</span></button>
<button class="nav-item" data-view="documents"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4"/><path d="M9 12h6M9 15.5h6"/></svg></span><span>Fiches techniques</span></button>
<button class="nav-item" data-view="tasks"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.2 2.2L16 8.8"/></svg></span><span>To-do list</span></button>
<button class="nav-item" data-view="requests"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.2 2.2-2.8-2.8z"/></svg></span><span>Besoins & interventions</span></button>
<button class="nav-item" data-view="reports"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg></span><span>Rapports hebdomadaires</span></button>
</nav>
      <div class="sidebar-bottom">
        <div class="user-card"><div class="avatar">AM</div><div><strong>Aloïs Monier</strong><small id="roleLabel">Administrateur</small></div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">Équipe</span><h1 id="pageTitle">Tableau de bord</h1></div>
        <div class="top-actions"><span class="status-dot"></span><span>Connecté</span><button id="themeToggle" class="theme-toggle" aria-label="Activer le mode sombre"><span class="theme-switch"></span><span class="theme-label">Sombre</span></button><button id="roleToggle" class="role-toggle">Admin ▾</button></div>
      </header>
      <section id="content"></section>
    </main>
<div class="bottom-nav">
<button class="active" data-view="dashboard"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10.5V19h11v-8.5"/><path d="M10 19v-5h4v5"/></svg></span><span>Accueil</span></button>
<button data-view="documents"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4"/><path d="M9 12h6M9 15.5h6"/></svg></span><span>Fiches</span></button>
<button data-view="tasks"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.2 2.2L16 8.8"/></svg></span><span>Tâches</span></button>
<button data-view="requests"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.2 2.2-2.8-2.8z"/></svg></span><span>Besoins</span></button>
<button data-view="reports"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg></span><span>Rapports</span></button>
</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="app.js?v=11"></script>
  <script>
    window.__teamhubToggleSignup=function(){
      var title=document.getElementById("authTitle"),msg=document.getElementById("authMessage"),nameWrap=document.getElementById("authNameWrap"),submit=document.getElementById("authSubmit"),switchBtn=document.getElementById("authSwitch"),name=document.getElementById("authName");
      if(!title)return;
      if(window.__teamhubAuthBound)return;
      var signup=title.textContent==="Connexion";
      title.textContent=signup?"Créer mon compte":"Connexion";
      msg.textContent=signup?"Le premier compte créé devient administrateur. Les suivants sont salariés par défaut.":"Connectez-vous pour accéder à votre équipe.";
      msg.style.color="";
      submit.textContent=signup?"Créer le compte":"Se connecter";
      switchBtn.textContent=signup?"J’ai déjà un compte":"Créer mon compte";
      nameWrap.hidden=!signup;
      name.required=signup;
    };
  </script>
  <script>
    setTimeout(function(){
      var content=document.getElementById("content");
      var gate=document.getElementById("authGate");
      if(content && !content.innerHTML.trim() && gate && gate.hidden){
        gate.hidden=false;
        var msg=document.getElementById("authMessage");
        if(msg) msg.textContent="Le chargement de TeamHub a rencontré un problème. Rechargez la page avec ?v=11.";
      }
    },5000);
  </script>
</body>
</html>

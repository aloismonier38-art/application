<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TeamHub — Application équipes</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">T</span><div><strong>TeamHub</strong><small>Gestion des équipes</small></div></div>
      <nav>
<button class="nav-item active" data-view="dashboard"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10.5V19h11v-8.5"/><path d="M10 19v-5h4v5"/></svg></span><span>Tableau de bord</span></button>
<button class="nav-item" data-view="documents"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4"/><path d="M9 12h6M9 15.5h6"/></svg></span><span>Fiches techniques</span></button>
<button class="nav-item" data-view="tasks"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.2 2.2L16 8.8"/></svg></span><span>To-do list</span></button>
<button class="nav-item" data-view="requests"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.2 2.2-2.8-2.8z"/></svg></span><span>Besoins & interventions</span></button>
<button class="nav-item" data-view="reports"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg></span><span>Rapports hebdomadaires</span></button>
</nav>
      <div class="sidebar-bottom">
        <div class="user-card"><div class="avatar">AM</div><div><strong>Aloïs Monier</strong><small id="roleLabel">Administrateur</small></div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">Équipe</span><h1 id="pageTitle">Tableau de bord</h1></div>
        <div class="top-actions"><span class="status-dot"></span><span>Connecté</span><button id="roleToggle" class="role-toggle">Admin ▾</button></div>
      </header>
      <section id="content"></section>
    </main>
<div class="bottom-nav">
<button class="active" data-view="dashboard"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10.5V19h11v-8.5"/><path d="M10 19v-5h4v5"/></svg></span><span>Accueil</span></button>
<button data-view="documents"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4"/><path d="M9 12h6M9 15.5h6"/></svg></span><span>Fiches</span></button>
<button data-view="tasks"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.2 2.2L16 8.8"/></svg></span><span>Tâches</span></button>
<button data-view="requests"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.2 2.2-2.8-2.8z"/></svg></span><span>Besoins</span></button>
<button data-view="reports"><span class="bottom-icon"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg></span><span>Rapports</span></button>
</div>
  </div>
  <script src="app.js?v=3"></script>
</body>
</html>

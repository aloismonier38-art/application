<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CosyHub — Liste préparatoire</title><link rel="stylesheet" href="styles.css?v=131"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>.wrap{max-width:1000px;margin:auto;padding:28px 20px 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.controls label{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}input,select{padding:10px;border:1px solid var(--line);border-radius:7px;font:inherit}.btn{padding:10px 14px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:7px;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--green)}.message{padding:12px;background:#fff4e6;margin:14px 0}.item{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.item small{display:block;color:var(--muted)}.qty{font-size:18px;font-weight:800;white-space:nowrap}.items{background:#fff;border:1px solid var(--line);padding:16px;border-radius:10px}@media print{.controls,.head button{display:none}.wrap{padding:0}}</style></head><body><main class="wrap"><div class="head"><div><div class="muted">PIZZA COSY · BOURGOIN-JALLIEU</div><h1>Liste préparatoire</h1><p class="muted">Quantités à préparer selon les recommandations et le stock enregistré.</p></div><button class="btn alt" onclick="location.href='inventaire.html'">Retour à l’inventaire</button></div><div id="message" class="message" hidden></div><div class="controls"><label>Date du service<input id="date" type="date"></label><label>Service<select id="service"><option value="lunch">Midi</option><option value="dinner" selected>Soir</option></select></label><button class="btn" id="load">Afficher la liste</button><button class="btn alt" id="print">Imprimer / PDF</button><button class="btn alt" id="csv">Exporter CSV</button></div><div class="items"><div id="meta" class="muted">Choisissez une date puis affichez la liste.</div><div id="list"></div></div></main><script>
(()=>{const $=id=>document.getElementById(id),est='d5836f2e-d760-4470-8cb6-12c539869800';let db,rows=[];function msg(t){$('message').hidden=false;$('message').textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}async function load(){try{const day=(new Date($('date').value+'T12:00:00').getDay()+6)%7,days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];const {data:{session}}=await db.auth.getSession();if(!session){msg('Connectez-vous à CosyHub puis rechargez cette page.');return}const s=await db.from('inventory_sessions').select('id,status,submitted_at').eq('establishment_id',est).eq('service_date',$('date').value).eq('service',$('service').value).maybeSingle();if(s.error)throw s.error;if(!s.data){rows=[];$('list').innerHTML='';$('meta').textContent='Aucun inventaire enregistré pour cette date et ce service.';return}const [lines,prods,recs]=await Promise.all([db.from('inventory_lines').select('product_id,stock_quantity,recommended_quantity,prep_quantity').eq('session_id',s.data.id),db.from('inventory_products').select('id,name,category,unit').eq('is_active',true),db.from('prep_day_recommendations').select('product_id,recommended_quantity').eq('establishment_id',est).eq('prep_day',days[day])]);if(lines.error)throw lines.error;if(prods.error)throw prods.error;if(recs.error)throw recs.error;const pm=Object.fromEntries((prods.data||[]).map(p=>[p.id,p])),rm=Object.fromEntries((recs.data||[]).map(r=>[r.product_id,Number(r.recommended_quantity)]));rows=(lines.data||[]).map(l=>{const p=pm[l.product_id]||{};const target=rm[l.product_id]??Number(l.recommended_quantity||0);return {name:p.name||'Produit',category:p.category||'À classer',unit:p.unit||'',stock:l.stock_quantity,target,prep:Math.max(0,target-Number(l.stock_quantity||0))}}).filter(x=>x.prep>0).sort((a,b)=>a.category.localeCompare(b.category,'fr')||a.name.localeCompare(b.name,'fr'));$('meta').textContent='Bourgoin-Jallieu · '+$('date').value+' · '+$('service').selectedOptions[0].text+' · '+rows.length+' références à préparer';$('list').innerHTML=rows.map(x=>'<div class="item"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.category)+' · Stock '+(x.stock===null?'non renseigné':esc(x.stock))+' / objectif '+x.target+'</small></div><div class="qty">'+x.prep+' '+esc(x.unit)+'</div></div>').join('')||'<p>Aucune préparation nécessaire.</p>'}catch(e){msg('Chargement impossible : '+e.message)}}async function init(){db=window.supabase.createClient(window.TEAMHUB_SUPABASE_URL,window.TEAMHUB_SUPABASE_PUBLISHABLE_KEY);$('date').value=today();$('load').onclick=load;$('service').onchange=load;$('date').onchange=load;$('print').onclick=()=>window.print();$('csv').onclick=()=>{const csv=[['Produit','Catégorie','Stock','Objectif','À préparer','Unité'],...rows.map(x=>[x.name,x.category,x.stock??'',x.target,x.prep,x.unit])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='liste-preparatoire-bourgoin.csv';a.click();URL.revokeObjectURL(a.href)};await load()}init().catch(e=>msg(e.message))})();
</script></body></html>

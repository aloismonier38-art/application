<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CosyHub — Liste préparatoire</title><link rel="stylesheet" href="styles.css?v=131"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>.wrap{max-width:1000px;margin:auto;padding:28px 20px 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;position:relative;padding-left:52px!important}.head>button{position:absolute;left:0;top:0}.muted{color:var(--muted)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.controls label{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}input,select{padding:10px;border:1px solid var(--line);border-radius:7px;font:inherit}.btn{padding:10px 14px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:7px;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--green)}.message{padding:12px;background:#fff4e6;margin:14px 0}.item{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.item small{display:block;color:var(--muted)}.qty{font-size:18px;font-weight:800;white-space:nowrap}.items{background:#fff;border:1px solid var(--line);padding:16px;border-radius:10px}@media print{.controls,.head button{display:none}.wrap{padding:0}}</style><style id="cosy-refresh">:root{--fresh-green:#245744;--fresh-line:#e2e8e3;--fresh-muted:#687a70;--fresh-bg:#f5f7f5}body{background:var(--fresh-bg)!important;color:#203d30!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;line-height:1.5}.wrap{max-width:1040px!important;padding:32px 24px 64px!important;margin:auto!important}h1{font-size:clamp(28px,3vw,38px)!important;line-height:1.15;letter-spacing:-.8px;color:var(--fresh-green)!important}h2{color:var(--fresh-green)!important}.items{border:1px solid var(--fresh-line)!important;border-radius:14px!important;box-shadow:0 3px 14px rgba(26,60,42,.035)!important;background:#fff!important;padding:22px!important}.controls{gap:12px!important;align-items:end!important;margin:22px 0!important}label{font-weight:650!important}input,select{border:1px solid #d7e1d9!important;border-radius:8px!important;min-height:42px;background:#fff!important}input:focus,select:focus{outline:none;border-color:var(--fresh-green)!important;box-shadow:0 0 0 3px rgba(36,87,68,.12)!important}.btn{border-radius:9px!important;min-height:42px;font-weight:700!important;background:var(--fresh-green)!important;border-color:var(--fresh-green)!important}.btn.alt{background:#fff!important;color:var(--fresh-green)!important;border-color:#cbd9ce!important}.item{padding:16px 4px!important;align-items:center;border-bottom:1px solid var(--fresh-line)!important}.qty{color:var(--fresh-green);font-variant-numeric:tabular-nums}.message{border:1px solid #e2e8e3;border-radius:10px!important;padding:14px 16px!important}@media(max-width:680px){.wrap{padding:20px 14px 40px!important}.controls{display:grid!important;grid-template-columns:1fr!important}.items{padding:14px!important}.item{gap:10px!important}}</style></head><body><main class="wrap"><div class="head"><div><div class="muted">PIZZA COSY · BOURGOIN-JALLIEU</div><h1>Liste préparatoire</h1><p class="muted">Quantités à préparer selon les recommandations et le stock enregistré.</p></div><button class="btn alt" onclick="location.href='inventaire.html'" aria-label="Retour à l’inventaire" title="Retour à l’inventaire" style="font-size:22px;padding:7px 13px">←</button></div><div id="message" class="message" hidden></div><div class="controls"><label>Date du service<input id="date" type="date"></label><button class="btn" id="load">Afficher la liste</button><button class="btn alt" id="print">Imprimer / PDF</button><button class="btn alt" id="csv">Exporter CSV</button></div><div class="items"><div id="meta" class="muted">Choisissez une date puis affichez la liste.</div><div id="list"></div></div></main><script>
(()=>{const $=id=>document.getElementById(id),est='d5836f2e-d760-4470-8cb6-12c539869800';let db,rows=[];function msg(t){$('message').hidden=false;$('message').textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}async function load(){try{const day=(new Date($('date').value+'T12:00:00').getDay()+6)%7,days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];const {data:{session}}=await db.auth.getSession();if(!session){msg('Connectez-vous à CosyHub puis rechargez cette page.');return}const s=await db.from('inventory_sessions').select('id,status,submitted_at,service').eq('establishment_id',est).eq('service_date',$('date').value).order('created_at',{ascending:false}).limit(1).maybeSingle();if(s.error)throw s.error;if(!s.data){rows=[];$('list').innerHTML='';$('meta').textContent='Aucun inventaire enregistré pour cette journée.';return}const [lines,prods,recs]=await Promise.all([db.from('inventory_lines').select('product_id,stock_quantity,recommended_quantity,prep_quantity').eq('session_id',s.data.id),db.from('inventory_products').select('id,name,category,unit').eq('is_active',true),db.from('prep_day_recommendations').select('product_id,recommended_quantity').eq('establishment_id',est).eq('prep_day',days[day])]);if(lines.error)throw lines.error;if(prods.error)throw prods.error;if(recs.error)throw recs.error;const pm=Object.fromEntries((prods.data||[]).map(p=>[p.id,p])),rm=Object.fromEntries((recs.data||[]).map(r=>[r.product_id,Number(r.recommended_quantity)]));rows=(lines.data||[]).map(l=>{const p=pm[l.product_id]||{};const target=rm[l.product_id]??Number(l.recommended_quantity||0);return {name:p.name||'Produit',category:p.category||'À classer',unit:p.unit||'',stock:l.stock_quantity,target,prep:Math.max(0,target-Number(l.stock_quantity||0))}}).filter(x=>x.prep>0).sort((a,b)=>a.category.localeCompare(b.category,'fr')||a.name.localeCompare(b.name,'fr'));$('meta').textContent='Bourgoin-Jallieu · '+$('date').value+' · '+rows.length+' références à préparer';$('list').innerHTML=rows.map(x=>'<div class="item"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.category)+' · Stock '+(x.stock===null?'non renseigné':esc(x.stock))+' / objectif '+x.target+'</small></div><div class="qty">'+x.prep+' '+esc(x.unit)+'</div></div>').join('')||'<p>Aucune préparation nécessaire.</p>'}catch(e){msg('Chargement impossible : '+e.message)}}async function init(){db=window.supabase.createClient(window.TEAMHUB_SUPABASE_URL,window.TEAMHUB_SUPABASE_PUBLISHABLE_KEY);$('date').value=today();$('load').onclick=load;$('date').onchange=load;$('print').onclick=()=>window.print();$('csv').onclick=()=>{const csv=[['Produit','Catégorie','Stock','Objectif','À préparer','Unité'],...rows.map(x=>[x.name,x.category,x.stock??'',x.target,x.prep,x.unit])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='liste-preparatoire-bourgoin.csv';a.click();URL.revokeObjectURL(a.href)};await load()}init().catch(e=>msg(e.message))})();
</script></body></html>

name: Auto version PIZZA COSY

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Incrémenter la version
        shell: python
        run: |
          import re
          from pathlib import Path

          app = Path("app.js")
          index = Path("index.html")

          app_text = app.read_text(encoding="utf-8")
          index_text = index.read_text(encoding="utf-8")

          match = re.search(r'const APP_VERSION="(\d+)\.(\d+)\.(\d+)"', app_text)
          if not match:
              raise SystemExit("APP_VERSION introuvable dans app.js")

          major, minor, patch = map(int, match.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          new_patch = str(patch + 1)

          app_text = re.sub(
              r'const APP_VERSION="\d+\.\d+\.\d+"',
              f'const APP_VERSION="{new_version}"',
              app_text,
              count=1
          )

          index_text = re.sub(
              r'1\.1\.\d+',
              new_version,
              index_text
          )
          index_text = re.sub(
              r'(app\.js\?v=)\d+',
              rf'\g<1>{new_patch}',
              index_text
          )
          index_text = re.sub(
              r'(styles\.css\?v=)\d+',
              rf'\g<1>{new_patch}',
              index_text
          )
          index_text = re.sub(
              r'(supabase-config\.js\?v=)\d+',
              rf'\g<1>{new_patch}',
              index_text
          )

          app.write_text(app_text, encoding="utf-8")
          index.write_text(index_text, encoding="utf-8")

          print(f"Version automatique : {new_version}")

      - name: Publier la nouvelle version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: version automatique"
          git push
